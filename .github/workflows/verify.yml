name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check data hashes
        run: sha256sum -c data/SHA256SUMS.txt
      - name: Bybit trade archive
        uses: actions/cache@v4
        with:
          path: data/ticks/*.csv.gz
          key: ticks-${{ hashFiles('config/runs.json', 'data/ticks/SHA256SUMS.txt') }}
      - run: python tools/fetch_ticks.py
      - run: python verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report
          path: report/REPORT.md
